<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manekin Ergonomi Interaktif 3D</title>
<!--
=====================================================================
 PETA KODE (garis besar isi file ini)
 1. <style>   : semua tampilan. Warna tema terang/gelap (variabel :root),
                tata letak kanvas 3D + panel kontrol, kartu pilihan simulasi.
 2. <body>    : kerangka HTML. #stage = kanvas 3D + tombol sudut pandang,
                #panel = pilihan simulasi, skor, postur siap pakai,
                kontrol beban (khusus mode angkat) dan slider sendi.
 3. <script>  : logika, berurutan dari atas ke bawah:
    a. Setup three.js (renderer, kamera, cahaya)
    b. Lingkungan 3D: lantai, dinding, lalu dua set ruangan
       (envSit = kursi + meja, envLift = rak + matras)
    c. Manekin: rangka sendi (node) + bentuk tubuh (mesh), dipakai kedua mode
    d. Beban 3D: kardus (dua tangan) dan karung (pundak)
    e. Tabel sendi T: batas gerak + rentang ideal per mode
    f. Data MODES: postur siap pakai dan sudut kamera tiap simulasi
    g. UI: kartu simulasi, tab bagian tubuh, slider, tombol
    h. Loop animasi tick(): gerakkan sendi, hitung skor, gambar ulang
=====================================================================
-->
<style>
/* Variabel warna. Mode gelap otomatis mengikuti pengaturan perangkat. */
:root{--bg:#f2f4f1;--pn:#fff;--fg:#1c2428;--mu:#5b666c;--ln:#d9dfdb;--ac:#256a8f;--ok:#2a9d5c;--wn:#d99512;--bd:#d4423a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181a;--pn:#1c2326;--fg:#e8edef;--mu:#9aa6ac;--ln:#2d373b;--ac:#6bb6e6}}
:root[data-theme="dark"]{--bg:#13181a;--pn:#1c2326;--fg:#e8edef;--mu:#9aa6ac;--ln:#2d373b;--ac:#6bb6e6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Tata letak: kiri kanvas 3D, kanan panel. Di layar sempit menjadi atas-bawah. */
#app{display:flex;height:100%}
#stage{position:relative;flex:1;min-width:0;min-height:0}
#c{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
#hud .b{background:rgba(28,35,38,.78);color:#e8edef;border-color:#3a464b}
#hint{position:absolute;left:10px;bottom:10px;right:10px;color:#cfd8dc;font-size:12px;text-shadow:0 1px 3px #000;pointer-events:none}
#panel{width:380px;background:var(--pn);border-left:1px solid var(--ln);overflow:auto;padding:16px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:13px}
h2{font-size:13px;margin:16px 0 6px;color:var(--mu);font-weight:600}
/* Tombol umum */
.b{border:1px solid var(--ln);background:var(--pn);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.b:hover{border-color:var(--ac)}
.b:focus-visible,input:focus-visible,.mc:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.b.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
/* Kartu pilihan simulasi (duduk / angkat barang) */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--ln);background:var(--pn);color:var(--fg);border-radius:12px;padding:10px;font:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.mc .ic{font-size:26px;line-height:1}
.mc small{color:var(--mu);font-size:12px;line-height:1.3}
.mc:hover{border-color:var(--ac)}
.mc.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
/* Kotak skor: menempel di atas panel supaya selalu terlihat saat menggeser slider */
#score{position:sticky;top:0;z-index:2;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin:14px 0 4px;box-shadow:0 4px 10px -6px rgba(0,0,0,.35)}
#score b{font-size:22px}
#lv{font-weight:600;margin-left:6px}
#bar{height:6px;background:var(--ln);border-radius:3px;margin:6px 0;overflow:hidden}
#bar i{display:block;height:100%;width:50%;background:var(--ok);transition:width .2s,background .2s}
#sum,#tips{color:var(--mu);font-size:12px}
#tips{margin-top:4px;color:var(--fg)}
/* Slider sendi dengan titik status hijau / kuning / merah */
.r{margin:12px 0}
.r label{display:flex;justify-content:space-between;gap:8px}
.r small{color:var(--mu)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--ok)}
input[type=range]{width:100%;accent-color:var(--ac);margin:4px 0 0}
.tg{display:flex;gap:14px;margin:12px 0;flex-wrap:wrap}
.tg label{display:flex;gap:6px;align-items:center}
/* Foto acuan (khusus mode angkat) */
#ref{margin:12px 0 0}
#ref img{width:100%;display:block;border-radius:8px;border:1px solid var(--ln)}
#ref figcaption{color:var(--mu);font-size:12px;margin-top:4px}
@media(max-width:800px){#app{flex-direction:column}#stage{flex:none;height:46%}#panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--ln)}}
</style></head><body>
<!-- KERANGKA HALAMAN: #app membagi layar menjadi #stage (3D) dan #panel (kontrol) -->
<div id="app">
 <div id="stage">
  <!-- Kanvas tempat three.js menggambar. aria-label untuk pembaca layar. -->
  <canvas id="c" aria-label="Model 3D manekin ergonomi"></canvas>
  <!-- Tombol sudut pandang (diisi oleh JS sesuai simulasi) -->
  <div id="hud"></div>
  <!-- Petunjuk singkat cara memakai, berubah sesuai simulasi -->
  <div id="hint"></div>
 </div>
 <aside id="panel">
  <h1>Manekin ergonomi</h1>
  <p class="sub">Pilih simulasi, gerakkan setiap sendi, lalu lihat apakah sudutnya masih dalam rentang aman.</p>

  <!-- Langkah 1: pilih simulasi. Kartunya dibuat oleh JS dari data MODES. -->
  <h2>1. Pilih simulasi</h2>
  <div class="modes" id="modes"></div>

  <!-- Skor postur 0 sampai 100, bilah warna, ringkasan, dan saran perbaikan -->
  <div id="score">
   <div>Skor postur <b id="sc">0</b> / 100 <span id="lv"></span></div>
   <div id="bar"><i></i></div>
   <div id="sum"></div>
   <div id="tips"></div>
  </div>

  <!-- Langkah 2: postur siap pakai (tombol dibuat JS per simulasi) -->
  <h2>2. Postur siap pakai</h2>
  <div class="row" id="pre"></div>

  <!-- Hanya tampil di simulasi angkat barang: jenis beban, berat, foto acuan -->
  <section id="lift" hidden>
   <h2>Beban yang dibawa</h2>
   <div class="row" id="ltype"></div>
   <div class="r"><label for="kg"><span>Berat beban</span><b id="kgv">10 kg</b></label>
    <input type="range" id="kg" min="0" max="40" step="1" value="10">
    <small>Semakin berat, semakin ketat batas aman punggung.</small></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $=s=>document.querySelector(s),D=Math.PI/180; // $ = pemilih elemen singkat, D = derajat ke radian

/* ---------- a. SETUP three.js ---------- */
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const S=new THREE.Scene();S.background=new THREE.Color(0x20262a);
const cam=new THREE.PerspectiveCamera(40,1,.1,50);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.minDistance=.8;ctl.maxDistance=7;ctl.autoRotateSpeed=1.5;
S.add(new THREE.HemisphereLight(0xffffff,0x556068,.85));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,4,3);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-3,right:3,top:3,bottom:-3});S.add(dl);
const C={skin:0xa9744f,shirt:0x6e6d3e,pants:0xb7a78a,shoe:0xf2f2f2,dark:0x1b1b1b,wood:0xd2a46a,woodD:0xb98a52};
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});

/* ---------- b. LINGKUNGAN ---------- */
// Dua grup ruangan. Hanya satu yang terlihat, tergantung simulasi yang dipilih.
const envSit=new THREE.Group(),envLift=new THREE.Group();S.add(envSit,envLift);
let G=envSit; // grup tujuan untuk fungsi E
// E = buat balok (lebar, tinggi, dalam, warna, posisi x y z, rotasi x) di grup G
const E=(w,h,d,c,x,y,z,rx=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.rotation.x=rx;m.castShadow=m.receiveShadow=true;G.add(m);return m};
// Bagian yang dipakai bersama: lantai, papan tulis di dinding, hiasan, pot tanaman
const fl=new THREE.Mesh(new THREE.PlaneGeometry(10,10),mat(0xc9c4bb));fl.rotation.x=-Math.PI/2;fl.position.y=.04;fl.receiveShadow=true;S.add(fl);
const cc=document.createElement('canvas');cc.width=1024;cc.height=512;const g=cc.getContext('2d');
g.fillStyle='#2b3236';g.fillRect(0,0,1024,512);g.lineCap='round';
for(let i=0;i<40;i++){const y=Math.random()*512;g.strokeStyle='rgba(220,230,235,'+(.03+Math.random()*.05)+')';g.lineWidth=20+Math.random()*50;g.beginPath();g.moveTo(Math.random()*300,y);g.bezierCurveTo(300,y-40,700,y+40,1024-Math.random()*200,y+(Math.random()-.5)*60);g.stroke()}
const wall=new THREE.Mesh(new THREE.PlaneGeometry(8,4),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cc)}));wall.position.set(0,2.04,-1.8);S.add(wall);
const hex=new THREE.Mesh(new THREE.TorusGeometry(.14,.018,6,6),mat(C.wood));hex.position.set(-1.1,1.9,-1.76);S.add(hex);
const pot=new THREE.Mesh(new THREE.CylinderGeometry(.1,.08,.18,12),mat(0xeeeeee));pot.position.set(-1.4,.13,-.9);S.add(pot);
for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.03,.4,6),mat(0x4f8a3f));l.position.set(-1.4+(i-2)*.03,.45,-.9);l.rotation.z=(i-2)*.18;S.add(l)}
// Ruangan simulasi DUDUK: kursi (dudukan, sandaran, 4 kaki), meja, rak bawah meja, buku
E(.46,.04,.44,C.woodD,0,.43,.02);E(.44,.36,.025,C.woodD,0,.69,-.22,-.15);
[[-.2,.2],[.2,.2],[-.2,-.2],[.2,-.2]].forEach(p=>E(.035,.39,.035,C.woodD,p[0],.235,p[1]));
E(1.7,.04,.7,C.wood,0,.74,.8);
[[-.75,.5],[.75,.5],[-.75,1.1],[.75,1.1]].forEach(p=>E(.05,.7,.05,C.woodD,p[0],.39,p[1]));
E(1.5,.03,.5,C.wood,0,.2,.8);E(.3,.03,.22,0xe8e2d4,-.45,.775,.75);E(.28,.025,.2,0xd8cdb8,-.45,.8,.75);
// Ruangan simulasi ANGKAT: rak tiga tingkat di belakang dan matras tempat berdiri
G=envLift;
[-.85,.85].forEach(x=>[-1.3,-.9].forEach(z=>E(.05,1.55,.05,C.woodD,x,.82,z)));
[.4,.95,1.5].forEach(y=>E(1.8,.04,.5,C.wood,0,y,-1.1));
E(.9,.015,.9,0x3a4a52,0,.048,0);

/* ---------- c. MANEKIN ---------- */
// reg = daftar bentuk per bagian tubuh (untuk disorot / diklik), N = daftar node sendi
const reg={head:[],torso:[],armL:[],armR:[],legL:[],legR:[]},N={};
// part = pasang bentuk ke induk; seg = tabung (anggota badan); ball = bola (sendi); node = titik putar sendi
const part=(geo,c,rg,p,x=0,y=0,z=0,sc)=>{const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);if(sc)m.scale.set(...sc);m.castShadow=true;m.userData.region=rg;p.add(m);reg[rg].push(m);return m};
const seg=(p,len,r1,r2,c,rg,up,sc)=>part(up?new THREE.CylinderGeometry(r2,r1,len,16):new THREE.CylinderGeometry(r1,r2,len,16),c,rg,p,0,up?len/2:-len/2,0,sc);
const ball=(p,r,c,rg,x,y,z,sc)=>part(new THREE.SphereGeometry(r,16,12),c,rg,p,x,y,z,sc);
const node=(n,p,x,y,z)=>{const o=new THREE.Group();o.position.set(x,y,z);p.add(o);N[n]=o;return o};
// root = titik panggul yang bisa naik turun. pel = panggul yang bisa condong (engsel pinggul).
// Kaki menempel ke root (tidak ikut condong), badan menempel ke pel.
const root=node('root',S,0,.55,0),pel=node('pel',root,0,0,0);
ball(pel,.1,C.pants,'torso',0,0,0,[1.5,.85,1.05]);
const lum=node('lum',pel,0,.07,0);seg(lum,.2,.14,.15,C.shirt,'torso',1,[1.1,1,.75]);
const tho=node('tho',lum,0,.2,0);seg(tho,.3,.15,.18,C.shirt,'torso',1,[1.2,1,.7]);
const neck=node('neck',tho,0,.31,0);seg(neck,.07,.045,.045,C.skin,'head',1);
ball(neck,.095,C.skin,'head',0,.17,0,[.92,1.15,1.05]);
part(new THREE.SphereGeometry(.1,16,12,0,Math.PI*2,0,Math.PI/2),C.dark,'head',neck,0,.18,-.012,[.95,1.1,1.1]);
ball(neck,.05,C.dark,'head',0,.11,.05,[1,.8,.8]);ball(neck,.012,C.skin,'head',0,.165,.105);
[-1,1].forEach(s=>part(new THREE.TorusGeometry(.027,.004,6,16),C.dark,'head',neck,s*.037,.185,.098));
// Lengan (bahu, siku, pergelangan) dan kaki (pinggul, lutut, pergelangan kaki), kiri dan kanan
for(const [s,k] of [[1,'L'],[-1,'R']]){
 const a='arm'+k,l='leg'+k;
 const sh=node('sh'+k,tho,s*.225,.26,0);ball(sh,.06,C.shirt,a);seg(sh,.3,.05,.042,C.shirt,a);
 const el=node('el'+k,sh,0,-.3,0);ball(el,.043,C.shirt,a);seg(el,.26,.042,.033,C.shirt,a);
 const wr=node('wr'+k,el,0,-.26,0);ball(wr,.033,C.skin,a);seg(wr,.1,.035,.028,C.skin,a,0,[1.25,1,.55]);
 if(k==='R')part(new THREE.BoxGeometry(.07,.14,.01),C.dark,a,wr,0,-.07,.035);
 const hp=node('hp'+k,root,s*.09,-.02,0);ball(hp,.07,C.pants,l);seg(hp,.42,.075,.058,C.pants,l);
 const kn=node('kn'+k,hp,0,-.42,0);ball(kn,.058,C.pants,l);seg(kn,.42,.056,.04,C.pants,l);
 const an=node('an'+k,kn,0,-.42,0);part(new THREE.BoxGeometry(.09,.07,.26),C.shoe,l,an,0,-.035,.08);
}
const ALL=[].concat(...Object.values(reg));

/* ---------- d. BEBAN 3D ---------- */
// Satu grup beban berisi dua bentuk: kardus (dipegang dua tangan) dan karung goni (di pundak)
const load=new THREE.Group();S.add(load);
const boxM=new THREE.Mesh(new THREE.BoxGeometry(.34,.28,.3),mat(0xc8a064));
const sackM=new THREE.Mesh(new THREE.SphereGeometry(.2,20,14),mat(0xb39766));sackM.scale.set(1,1.5,.85);
boxM.castShadow=sackM.castShadow=true;load.add(boxM,sackM);
const v1=new THREE.Vector3(),v2=new THREE.Vector3(),qt=new THREE.Quaternion(),tilt=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),22*D);

/* ---------- e. TABEL SENDI ---------- */
// Kolom: id, wilayah, label, node, sumbu putar, tanda arah, min, maks, ideal duduk [bawah,atas], ideal angkat [bawah,atas]
// Wilayah arm/leg otomatis dibuat kiri (L) dan kanan (R). tanda 's' = mengikuti sisi tubuh. null = sendi tidak dipakai di mode itu.
const T=[
 ['nf','head','Leher: tunduk atau dongak','neck','x',1,-40,60,[0,15],[-20,15]],
 ['nt','head','Leher: miring ke samping','neck','z',1,-40,40,[-5,5],[-5,5]],
 ['nr','head','Leher: menoleh','neck','y',1,-70,70,[-15,15],[-15,15]],
 ['pv','torso','Panggul: condong ke depan (engsel pinggul)','pel','x',1,-10,90,null,[0,60]],
 ['lf','torso','Pinggang: bungkuk atau sandar','lum','x',1,-30,60,[-10,10],[-5,10]],
 ['lt','torso','Pinggang: miring','lum','z',1,-30,30,[-5,5],[-5,5]],
 ['lr','torso','Pinggang: putar','lum','y',1,-45,45,[-10,10],[-10,10]],
 ['tf','torso','Punggung atas: bungkuk','tho','x',1,-20,40,[-5,10],[-5,10]],
 ['sf','arm','Bahu: angkat ke depan','sh','x',-1,-50,170,[0,25],[0,80]],
 ['sa','arm','Bahu: buka ke samping','sh','z','s',0,150,[0,20],[0,20]],
 ['sr','arm','Bahu: putar','sh','y','s',-60,60,[-10,10],[-10,10]],
 ['ef','arm','Siku: tekuk','el','x',-1,0,145,[90,120],[20,120]],
 ['wf','arm','Pergelangan tangan: tekuk','wr','x',-1,-60,70,[-10,10],[-15,15]],
 ['wd','arm','Pergelangan tangan: miring','wr','z','s',-25,30,[-10,10],[-10,10]],
 ['hf','leg','Pinggul: angkat paha','hp','x',-1,0,120,[85,110],[0,100]],
 ['ha','leg','Pinggul: buka paha','hp','z','s',-30,40,[-5,15],[0,20]],
 ['kf','leg','Lutut: tekuk','kn','x',1,0,130,[85,110],[20,110]],
 ['af','leg','Pergelangan kaki','an','x',1,-20,40,[-5,10],[-10,15]]
];
// Ubah tabel T menjadi daftar sendi aktif untuk satu mode
function makeJoints(m){const o=[];
 for(const r of T){const d=r[m==='duduk'?8:9];if(!d)continue;
  const sd=/arm|leg/.test(r[1])?[[1,'L'],[-1,'R']]:[[1,'']];
  for(const [s,k] of sd)o.push({id:r[0]+k,rg:r[1]+k,lb:r[2],nd:r[3]+k,ax:r[4],sg:r[5]==='s'?s:r[5],mn:r[6],mx:r[7],lo:d[0],hi:d[1]})}
 return o}
// ex: salin nilai satu sendi ke kiri dan kanan sekaligus
const ex=o=>{const r={};for(const k in o){if(/^(sf|sa|sr|ef|wf|wd|hf|ha|kf|af)$/.test(k)){r[k+'L']=o[k];r[k+'R']=o[k]}else r[k]=o[k]}return r};

/* ---------- f. DATA SIMULASI ---------- */
// V: buat 5 sudut kamera (posisi dan titik pandang) untuk tinggi sasaran y dan kedalaman z
const V=(y,z)=>({Perspektif:[[2.4,y+.65,z+2.3],[0,y,z]],Depan:[[0,y+.35,z+3.3],[0,y,z]],Samping:[[3.4,y+.15,z],[0,y,z]],Belakang:[[0,y+.45,z-3.2],[0,y,z]],Atas:[[0,y+3.4,z+.7],[0,y-.3,z]]});
// Tiap simulasi: ikon, judul, deskripsi, ruangan, sudut kamera, petunjuk, dan postur siap pakai (P)
// Postur punya: nama n, nilai sudut v, dan (mode angkat) jenis beban load serta berat kg
const MODES={
 duduk:{icon:'🪑',n:'Duduk di meja',d:'Postur kerja di depan meja dan kursi.',env:envSit,vw:V(.85,.35),
  hint:'Seret untuk memutar, cubit atau scroll untuk zoom, ketuk bagian tubuh untuk memilihnya.',
  P:{
   foto:{n:'Seperti foto',v:{...ex({nf:14,nt:0,nr:0,lf:-10,lt:0,lr:0,tf:6,sf:18,sa:6,sr:0,ef:105,wf:25,wd:0,hf:88,ha:5,kf:80,af:10}),hfL:70,kfL:40,haL:15}},
   ideal:{n:'Ideal',v:ex({nf:5,nt:0,nr:0,lf:0,lt:0,lr:0,tf:2,sf:10,sa:5,sr:0,ef:100,wf:0,wd:0,hf:95,ha:5,kf:95,af:3})},
   bungkuk:{n:'Membungkuk',v:ex({nf:45,nt:8,nr:0,lf:30,lt:0,lr:0,tf:25,sf:40,sa:20,sr:0,ef:75,wf:40,wd:15,hf:75,ha:20,kf:60,af:25})}}},
 angkat:{icon:'📦',n:'Angkat barang',d:'Mengangkat atau memanggul beban dari posisi berdiri.',env:envLift,vw:V(.9,0),
  hint:'Seret untuk memutar, scroll untuk zoom. Beban mengikuti tangan atau pundak. Atur berat di panel.',
  P:{
   foto:{n:'Seperti foto',load:'bahu',kg:20,v:{...ex({nf:-15,nt:0,nr:0,pv:15,lf:15,lt:0,lr:0,tf:15,sf:40,sa:10,sr:0,ef:135,wf:0,wd:0,hf:10,ha:8,kf:15,af:0}),sfR:60,hfL:25,kfL:30}},
   ideal:{n:'Teknik ideal',load:'tangan',kg:12,v:ex({nf:-10,nt:0,nr:0,pv:40,lf:2,lt:0,lr:0,tf:2,sf:44,sa:5,sr:0,ef:20,wf:0,wd:0,hf:70,ha:10,kf:100,af:5})},
   dada:{n:'Bawa di dada',load:'tangan',kg:12,v:ex({nf:0,nt:0,nr:0,pv:3,lf:0,lt:0,lr:0,tf:0,sf:45,sa:5,sr:0,ef:95,wf:0,wd:0,hf:5,ha:8,kf:12,af:2})},
   bungkuk:{n:'Membungkuk',load:'tangan',kg:12,v:ex({nf:30,nt:5,nr:0,pv:25,lf:40,lt:0,lr:0,tf:25,sf:90,sa:15,sr:0,ef:5,wf:25,wd:10,hf:10,ha:10,kf:8,af:3})}}}
};

/* ---------- g. UI ---------- */
const RG={head:'Kepala dan leher',torso:'Badan',armL:'Lengan kiri',armR:'Lengan kanan',legL:'Kaki kiri',legR:'Kaki kanan'};
const cur={},tgt={}; // cur = sudut tampil saat ini, tgt = sudut tujuan (bergerak halus)
let mode='',J=[],sel='head',tw=null,loadType='tangan',kg=10;
// mk: buat tombol dan tempel ke induk
const mk=(par,t,cls,fn,d)=>{const b=document.createElement('button');b.className=cls;b.textContent=t;b.onclick=fn;if(d)b.dataset.k=d;par.appendChild(b);return b};
// go: pindahkan kamera (langsung atau dengan animasi 0,7 detik)
function go(v,now){const p=new THREE.Vector3(...v[0]),q=new THREE.Vector3(...v[1]);if(now){cam.position.copy(p);ctl.target.copy(q);tw=null}else tw={t:performance.now(),p0:cam.position.clone(),q0:ctl.target.clone(),p1:p,q1:q}}
// Sorot bagian tubuh yang sedang dipilih
function hl(){for(const k in reg)reg[k].forEach(m=>m.material.emissive.setHex(k===sel?0x1b4a73:0))}
// select: tampilkan slider semua sendi pada satu bagian tubuh
function select(k){sel=k;[...$('#tabs').children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));hl();const rows=$('#rows');rows.innerHTML='';
 J.filter(j=>j.rg===k).forEach(j=>{const d=document.createElement('div');d.className='r';
  d.innerHTML='<label><span><i class="dot"></i>'+j.lb+'</span><b></b></label><input type="range" min="'+j.mn+'" max="'+j.mx+'" step="1" aria-label="'+j.lb+'"><small>Rentang ideal '+j.lo+'° sampai '+j.hi+'°</small>';
  j.dot=d.querySelector('.dot');j.val=d.querySelector('b');j.inp=d.querySelector('input');j.inp.value=cur[j.id];
  j.inp.oninput=()=>{tgt[j.id]=cur[j.id]=+j.inp.value};rows.appendChild(d)})}
// Sinkronkan kontrol beban dengan variabel loadType dan kg
function syncLoad(){[...$('#ltype').children].forEach(b=>b.classList.toggle('on',b.dataset.k===loadType));$('#kg').value=kg;$('#kgv').textContent=kg+' kg'}
// Terapkan postur siap pakai (instan = langsung tanpa animasi)
function applyPreset(p,instant){J.forEach(j=>{tgt[j.id]=p.v[j.id]??0;if(instant)cur[j.id]=tgt[j.id]});if(p.load){loadType=p.load;kg=p.kg;syncLoad()}}
// setMode: ganti simulasi. Ruangan, sendi, postur, kamera, dan petunjuk ikut berubah.
function setMode(m,first){mode=m;const M=MODES[m];J=makeJoints(m);
 envSit.visible=m==='duduk';envLift.visible=m==='angkat';
 root.position.set(0,.55,0);pel.rotation.set(0,0,0);
 [...$('#modes').children].forEach(b=>{const on=b.dataset.k===m;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
 $('#lift').hidden=m!=='angkat';$('#hint').textContent=M.hint;
 const pre=$('#pre');pre.innerHTML='';Object.keys(M.P).forEach(k=>mk(pre,M.P[k].n,'b',()=>applyPreset(M.P[k])));
 const hud=$('#hud');hud.innerHTML='';Object.keys(M.vw).forEach(k=>mk(hud,k,'b',()=>go(M.vw[k])));
 applyPreset(M.P.foto,true);select(sel);go(M.vw.Perspektif,first);last=''}
// Bangun kartu simulasi, tab bagian tubuh, dan kontrol beban sekali di awal
Object.keys(MODES).forEach(k=>{const M=MODES[k],b=document.createElement('button');b.className='mc';b.dataset.k=k;
 b.innerHTML='<span class="ic">'+M.icon+'</span><b>'+M.n+'</b><small>'+M.d+'</small>';b.onclick=()=>{if(k!==mode)setMode(k)};$('#modes').appendChild(b)});
Object.keys(RG).forEach(k=>{const b=mk($('#tabs'),'','b',()=>select(k),k);b.innerHTML='<i class="dot"></i>'+RG[k]});
mk($('#ltype'),'Dua tangan (kardus)','b',()=>{loadType='tangan';syncLoad()},'tangan');
mk($('#ltype'),'Di pundak (karung)','b',()=>{loadType='bahu';syncLoad()},'bahu');
$('#kg').oninput=e=>{kg=+e.target.value;syncLoad()};
$('#rot').onchange=e=>ctl.autoRotate=e.target.checked;
// Mode tembus: bentuk tubuh dibuat setengah transparan
$('#gh').onchange=e=>ALL.forEach(m=>{m.material.transparent=e.target.checked;m.material.opacity=e.target.checked?.4:1;m.material.depthWrite=!e.target.checked;m.material.needsUpdate=true});
// Ketuk badan manekin untuk memilih bagian tubuh (raycaster); geseran lebih dari 5 px dianggap memutar kamera
const ray=new THREE.Raycaster(),mo=new THREE.Vector2();let dn=null;
cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;const r=cv.getBoundingClientRect();
 mo.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mo,cam);
 const h=ray.intersectObjects(ALL,false)[0];if(h)select(h.object.userData.region)});
new ResizeObserver(()=>{const s=$('#stage');R.setSize(s.clientWidth,s.clientHeight,false);cam.aspect=s.clientWidth/s.clientHeight;cam.updateProjectionMatrix()}).observe($('#stage'));

/* ---------- h. LOOP ANIMASI ---------- */
// st: status sendi. 0 = di rentang ideal, 1 = melenceng sampai 12 derajat, 2 = berisiko
const st=(j,v)=>{const d=v<j.lo?j.lo-v:v>j.hi?v-j.hi:0;return d===0?0:d<=12?1:2};
const COL=['var(--ok)','var(--wn)','var(--bd)'];
let last='';
setMode('duduk',true);
(function tick(){requestAnimationFrame(tick);
 // 1. gerakkan setiap sendi menuju sudut tujuan secara halus
 for(const j of J){const d=tgt[j.id]-cur[j.id];cur[j.id]=Math.abs(d)>.05?cur[j.id]+d*.18:tgt[j.id];N[j.nd].rotation[j.ax]=j.sg*cur[j.id]*D}
 const lift=mode==='angkat';
 // 2. mode angkat: turunkan atau naikkan panggul supaya telapak kaki tetap menapak lantai
 if(lift){const leg=k=>{const a=-cur['hf'+k]*D,b=a+cur['kf'+k]*D;return[-.02-.42*Math.cos(a)-.42*Math.cos(b),-.42*Math.sin(a)-.42*Math.sin(b)]};
  const A=leg('L'),B=leg('R');root.position.set(0,Math.max(.11-A[0],.11-B[0]),-(A[1]+B[1])/2)}
 // 3. letakkan beban: di antara dua tangan, atau di pundak
 load.visible=lift;
 if(lift){S.updateMatrixWorld(true);const hand=loadType==='tangan';boxM.visible=hand;sackM.visible=!hand;
  if(hand){N.wrL.localToWorld(v1.set(0,-.08,0));N.wrR.localToWorld(v2.set(0,-.08,0));load.position.copy(v1).add(v2).multiplyScalar(.5);load.position.y=Math.max(load.position.y,.19);load.quaternion.identity()}
  else{load.position.set(.12,.36,-.2);N.tho.localToWorld(load.position);N.tho.getWorldQuaternion(qt);load.quaternion.copy(qt).multiply(tilt)}}
 // 4. hitung status tiap sendi, perbarui slider yang tampil, dan kumpulkan yang berisiko
 let w=0,b=0;const bad=[],wr={};
 for(const j of J){const v=Math.round(cur[j.id]),s=st(j,v);if(s===1)w++;if(s===2){b++;bad.push(j)}wr[j.rg]=Math.max(wr[j.rg]||0,s);
  if(j.rg===sel&&j.val){j.val.textContent=v+'°';j.dot.style.background=COL[s];if(document.activeElement!==j.inp)j.inp.value=v}}
 // 5. skor: kurangi 6 poin per sendi berisiko, 2,5 per sendi perlu perhatian, ditambah penalti beban (makin berat dan makin bungkuk makin besar)
 const lp=lift?Math.round(Math.max(0,kg-8)*.25*(1+Math.max(0,cur.lf+cur.tf-10)/20)):0;
 const sc=Math.max(0,Math.round(100-b*6-w*2.5-lp)),t=sc+'|'+b+'|'+w+'|'+lp+'|'+JSON.stringify(wr)+'|'+mode;
 // 6. perbarui teks, bilah, saran, dan titik status tab hanya jika ada perubahan
 if(t!==last){last=t;$('#sc').textContent=sc;const i=$('#bar i'),c=sc>=75?0:sc>=50?1:2;i.style.width=sc+'%';i.style.background=COL[c];
  $('#lv').textContent=['Aman','Perlu perhatian','Berisiko tinggi'][c];$('#lv').style.color=COL[c];
  $('#sum').textContent=b+' sendi berisiko, '+w+' sendi perlu perhatian, dari '+J.length+' sendi yang diukur.'+(lp?' Beban '+kg+' kg mengurangi '+lp+' poin.':'');
  $('#tips').innerHTML=bad.length?'<b>Perbaiki dulu:</b> '+bad.slice(0,3).map(j=>j.lb+' ('+(j.rg.slice(-1)==='L'||j.rg.slice(-1)==='R'?(j.rg.slice(-1)==='L'?'kiri':'kanan')+', ':'')+'ideal '+j.lo+'° sampai '+j.hi+'°)').join('; ')+(bad.length>3?'; dan '+(bad.length-3)+' lainnya.':'.'):'Postur sudah baik, pertahankan.';
  [...$('#tabs').children].forEach(x=>x.querySelector('.dot').style.background=COL[wr[x.dataset.k]||0])}
 // 7. animasi perpindahan kamera, lalu gambar ulang
 if(tw){const k=Math.min(1,(performance.now()-tw.t)/700),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.position.lerpVectors(tw.p0,tw.p1,e);ctl.target.lerpVectors(tw.q0,tw.q1,e);if(k>=1)tw=null}
 ctl.update();R.render(S,cam)})();
</script></body></html>
